<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Listing | UpNow</title>
<meta name="description" id="mdesc" content="">
<link rel="stylesheet" href="css/styles.css">
<style>
.crumbs{display:flex;gap:6px;color:var(--ink3);font-size:12.5px;padding:18px 0 10px;flex-wrap:wrap}
.crumbs a:hover{color:var(--g7);text-decoration:underline}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:16px}
.top h1{font-family:var(--serif);font-weight:400;font-size:36px;line-height:1.1;letter-spacing:-.01em}
.top .sub{display:flex;gap:14px;color:var(--ink2);margin-top:8px;flex-wrap:wrap;align-items:center;font-size:13px}
.top .sub span{display:flex;align-items:center;gap:5px}
.top .sub .ico{width:14px;height:14px;color:var(--ink3)}
.top .acts{display:flex;gap:8px}
.gal{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:200px 200px;gap:8px;border-radius:18px;overflow:hidden;position:relative}
.gal>div{background:var(--g1);position:relative;overflow:hidden;cursor:zoom-in}
.gal>div:first-child{grid-row:1/3}
.gal.g2{grid-template-columns:2fr 1fr}.gal.g2>div:first-child{grid-row:1/3}.gal.g2>div:only-child{grid-column:1/-1}
.flowrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flowrow .fn{padding:9px 14px;border-radius:99px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:13px}
.flowrow .fn.on{background:var(--g7);color:#fff;border-color:var(--g7)}
.flowrow .ar{color:var(--ink3)}
.keyrow small .ico{width:15px;height:15px;color:var(--g6)}
[data-fav].on .ico{fill:var(--red);stroke:var(--red)}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.gal>div:hover img{transform:scale(1.03)}
.gal .all{position:absolute;right:14px;bottom:14px;background:#fff;border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px;display:flex;gap:6px;align-items:center;box-shadow:var(--sh)}
.cols{display:grid;grid-template-columns:1fr 380px;gap:32px;margin-top:24px;align-items:start}
.keyrow{display:flex;gap:0;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.keyrow div{flex:1;padding:14px 16px;border-right:1px solid var(--line)}
.keyrow div:last-child{border:0}
.keyrow small{display:block;color:var(--ink3);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.keyrow b{font-size:15px}
.sec{margin-top:30px}
.sec h2{font-size:19px;letter-spacing:-.01em;margin-bottom:14px}
.about{color:var(--ink2);line-height:1.65}
.facts{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.facts div{display:flex;justify-content:space-between;padding:11px 16px;border-bottom:1px solid var(--line);font-size:13px}
.facts div:nth-child(odd){border-right:1px solid var(--line)}
.facts span{color:var(--ink3)}.facts b{text-transform:capitalize;text-align:right}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.feat div{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-weight:600;font-size:13px}
.feat .ico{color:var(--g6)}
.permit{display:flex;gap:16px;align-items:center;background:#fff;border:1.5px dashed var(--g5);border-radius:14px;padding:16px}
.permit .qr{width:72px;height:72px;display:grid;grid-template-columns:repeat(9,1fr);gap:1px;flex:none}
.permit .qr i{background:var(--ink);border-radius:1px}.permit .qr i.o{background:transparent}
.permit b{display:block}.permit span{color:var(--ink3);font-size:12.5px}
.mapmini{height:240px;border-radius:14px;overflow:hidden;background:#e8efe9;position:relative;border:1px solid var(--line)}
.mapmini svg{position:absolute;inset:0;width:100%;height:100%}
.mapmini .p{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);background:var(--g8);color:#fff;padding:6px 12px;border-radius:99px;font-weight:800;font-size:12px;box-shadow:var(--sh)}
.near{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.near span{font-size:12px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 10px;color:var(--ink2)}
.revs{display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}
.revs .big{font-size:44px;font-weight:800;line-height:1}
.bars div{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink3);margin:4px 0}
.bars i{flex:1;height:6px;background:var(--bg);border-radius:9px;overflow:hidden}.bars i b{display:block;height:100%;background:var(--g6)}
.rv{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.rv div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;font-size:13px;color:var(--ink2)}
.rv b{color:var(--ink);display:block;margin-bottom:2px}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}

/* contact panel */
.cp{position:sticky;top:80px;display:flex;flex-direction:column;gap:14px}
.cbox{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--sh)}
.cbox .pr{font-size:28px;font-weight:800;letter-spacing:-.02em}.cbox .pr span{font-size:14px;color:var(--ink3);font-weight:500}
.cbox .alt{display:flex;gap:6px;margin:10px 0 0;flex-wrap:wrap}
.cbox .alt button{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;border:1px solid var(--line2)}
.cbox .alt button.on{background:var(--g8);color:#fff;border-color:var(--g8)}
.cbox .sub{color:var(--ink3);font-size:12.5px;margin-top:6px}
.cbox hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.cbox .ctas{display:grid;gap:8px}
.cbox .ctas .btn{height:48px;font-size:14.5px}
.cbox .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.resp{display:flex;align-items:center;gap:8px;background:var(--g1);color:var(--g8);border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:600;margin-top:12px}
.resp i{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.2)}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;text-align:center}
.pstats div{background:var(--bg);border-radius:10px;padding:8px 4px}.pstats b{display:block;font-size:14px}.pstats span{font-size:11px;color:var(--ink3)}
.safety{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:12.5px;color:var(--ink2)}
.safety b{color:var(--ink);display:flex;align-items:center;gap:6px;margin-bottom:6px}
.safety .ico{color:var(--g6)}

/* mobile sticky bar */
.mbar{display:none}
@media (max-width:980px){.cols{grid-template-columns:1fr}.cp{position:static}.mbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px;gap:8px;z-index:90}.mbar .btn{flex:1}}

.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:250;display:none;align-items:center;justify-content:center}
.lb.on{display:flex}.lb img{max-width:88vw;max-height:84vh;border-radius:8px}
.lb button{position:absolute;color:#fff;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center}
.lb .l{left:24px}.lb .r{right:24px}.lb .c{top:20px;right:24px}
.lb .n{position:absolute;bottom:20px;color:#fff;font-weight:700}
</style></head>
<body>
<div id="hdr"></div>
<main class="wrap" id="main" data-screen-label="Listing detail"></main>
<div id="ftr"></div>
<div class="lb" id="lb"></div>
<div class="mbar" id="mbar"></div>
<script src="js/data.js"></script><script src="js/common.js"></script>
<script>
const { VERTICALS, LISTINGS, areaName, offerOf } = UP;
const { ico, esc, toQuery, blankState } = UPUI;
const id = new URLSearchParams(location.search).get('id') || LISTINGS[0].id;
const l = UPUI.byId(id) || LISTINGS[0];
const Vx = VERTICALS[l.v], O = offerOf(l.v, l.cat);
const seg = O.defs.find(d => d.type === 'seg');
let per = seg ? seg.options[0].v : null;
document.getElementById('hdr').innerHTML = UPUI.header(l.v);
document.getElementById('ftr').innerHTML = UPUI.footer();
const where = O.locAll ? 'UAE' : areaName(l.loc);
document.title = `${l.title} · ${where} | UpNow`;
document.getElementById('mdesc').content = `${l.title} in ${where}. ${UPUI.priceText(l).n}${UPUI.priceText(l).u}. Contact ${l.provider.name} directly by phone or WhatsApp. Ref ${l.ref}.`;

const facts = () => [['Offering', O.label], ['Price basis', O.basis], ...O.defs.map(d => { const v = UPUI.factValue(d, l); return v && d.type !== 'toggle' ? [d.label, v] : null; }).filter(Boolean), ['Reference', l.ref], l.permit && ['DLD permit', l.permit], ['Listed', l.posted === 0 ? 'Today' : l.posted + ' days ago']].filter(Boolean);
const feats = () => O.defs.filter(d => d.id !== 'verified').flatMap(d => { const lv = l.a[d.field || d.id]; if (d.type === 'toggle') return lv ? [d.label] : []; if (d.type === 'multi' && Array.isArray(lv)) return lv.map(x => (d.options.find(o => o.v === x) || {}).l || x); return []; });
const about = () => `${l.title} — offered by ${l.provider.name} (${l.provider.org}) ${O.locAll ? 'across the UAE' : 'in ' + areaName(l.loc) + ', Dubai'}. Pricing is ${O.basis.toLowerCase()}, starting at ${UPUI.priceText(l).n.replace('From ', '')}. ${l.coverage ? 'Serves ' + l.coverage.map(areaName).slice(0, 4).join(', ') + ' and more. ' : ''}To proceed, use “${O.action}”, call or WhatsApp — quote reference ${l.ref}. UpNow doesn't take payments; you agree terms directly with the provider.`;
function qr() { let r = 0; for (const c of l.ref) r += c.charCodeAt(0); return Array.from({ length: 81 }, (_, i) => { const x = i % 9, y = Math.floor(i / 9); if ((x < 3 && y < 3) || (x > 5 && y < 3) || (x < 3 && y > 5)) return `<i class="${(x % 9 === 1 || x === 7) && (y === 1 || y === 7) ? 'o' : ''}"></i>`; r = (r * 9301 + 49297) % 233280; return `<i class="${r / 233280 > .5 ? '' : 'o'}"></i>`; }).join(''); }

function paint() {
  const S = seg ? { o: l.cat, f: { [seg.id]: per } } : null;
  const pt = UPUI.priceText(l, S);
  const crumbs = [['Home', 'Home.html'], [Vx.label, 'Search.html?v=' + l.v], [O.label, 'Search.html' + toQuery(blankState(l.v, l.cat))]];
  if (!O.locAll) crumbs.push([areaName(l.loc), 'Search.html' + toQuery({ ...blankState(l.v, l.cat), loc: [l.loc] })]);
  const similar = UPUI.results(blankState(l.v, l.cat)).filter(x => x.id !== l.id).sort((a, b) => (b.loc === l.loc) - (a.loc === l.loc)).slice(0, 4);
  const imgs = l.img.length ? l.img : [null];
  const key = O.meta(l.a, l);
  document.getElementById('main').innerHTML = `
  <nav class="crumbs">${crumbs.map(([t, h], i) => (i ? '<span>/</span>' : '') + `<a href="${h}">${esc(t)}</a>`).join('')}<span>/</span><span style="color:var(--ink)">${esc(l.ref)}</span></nav>
  <div class="top"><div><h1>${esc(l.title)}</h1>
    <div class="sub"><span>${ico('pin')}${O.locAll ? 'Covers all UAE' : esc((l.building ? l.building + ', ' : '') + areaName(l.loc)) + ', Dubai'}</span><span class="stars">${ico('star')}${l.rating} <span style="color:var(--ink3);font-weight:500">(${l.reviews.toLocaleString()} reviews)</span></span>
      ${l.a.verified ? `<span style="color:var(--g7);font-weight:700">${ico('shield')}Verified</span>` : ''}<span>${ico('tag')}${esc(O.basis)}</span></div></div>
    <div class="acts"><button class="btn btn-o btn-sm" onclick="navigator.clipboard&&navigator.clipboard.writeText(location.href);UPUI.toast('Link copied')">${ico('share')}Share</button><button class="btn btn-o btn-sm" data-fav="${l.id}">${ico('heart')}Save</button></div></div>
  <div class="gal ${imgs.length < 3 ? 'g2' : ''}">${(imgs.length >= 3 ? imgs.slice(0, 5) : imgs).map((src, i) => `<div data-lb="${i}">${src ? `<img src="${src}" alt="">` : UPUI.photo(l)}</div>`).join('')}${l.img.length ? `<button class="all" data-lb="0">${ico('grid4')}Show all ${l.img.length} photos</button>` : ''}</div>
  <div class="cols"><div>
    <div class="keyrow">${key.map(([i, t]) => `<div><small>${ico(i)}</small><b>${esc(t)}</b></div>`).join('')}<div><small>Price basis</small><b>${esc(O.basis)}</b></div></div>
    <section class="sec"><h2>About this ${esc(O.label.toLowerCase())}</h2><p class="about">${esc(about())}</p></section>
    <section class="sec"><h2>Details</h2><div class="facts">${facts().map(([k, v]) => `<div><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}${facts().length % 2 ? '<div></div>' : ''}</div></section>
    ${feats().length ? `<section class="sec"><h2>What's included</h2><div class="feat">${feats().map(f => `<div>${ico('check')}${esc(f)}</div>`).join('')}</div></section>` : ''}
    <section class="sec"><h2>What happens after you enquire</h2><div class="flowrow">${O.flow.map((f, i) => `${i ? `<span class="ar">${ico('arrow')}</span>` : ''}<span class="fn ${i === 0 ? 'on' : ''}">${esc(f)}</span>`).join('')}</div><p style="color:var(--ink3);font-size:12.5px;margin:10px 0 0">Step 1 happens on UpNow (call, WhatsApp or request). Everything after is handled directly with ${esc(l.provider.name)}.</p></section>
    ${l.permit ? `<section class="sec"><h2>Regulatory information</h2><div class="permit"><div class="qr">${qr()}</div><div><b>DLD Permit ${l.permit}</b><span>${esc(l.provider.org)} · Scan to validate on the Dubai REST app</span></div></div></section>` : ''}
    ${O.locAll ? '' : `<section class="sec"><h2>${l.coverage ? 'Service area' : 'Location'}</h2><div class="mapmini"><svg viewBox="0 0 100 60" preserveAspectRatio="none">${[15, 35, 55, 75].map(x => `<line x1="${x}" y1="0" x2="${x - 6}" y2="60" stroke="#fff" stroke-width=".7"/>`).join('')}${[18, 38].map(y => `<line x1="0" y1="${y}" x2="100" y2="${y - 4}" stroke="#fff" stroke-width="1"/>`).join('')}<rect x="60" y="8" width="14" height="10" fill="#d7e8dc"/><rect x="18" y="36" width="12" height="12" fill="#d7e8dc"/></svg><div class="p">${esc(areaName(l.loc))}</div></div>
      ${l.coverage ? `<div class="near">${l.coverage.map(c => `<span>${esc(areaName(c))}</span>`).join('')}</div>` : ''}</section>`}
    <section class="sec"><h2>Reviews</h2><div class="revs"><div><div class="big">${l.rating}</div><div style="color:var(--ink3);font-size:12.5px;margin-top:6px">${l.reviews.toLocaleString()} verified reviews</div></div>
      <div class="bars">${[72, 18, 6, 3, 1].map((d, i) => `<div>${5 - i}★<i><b style="width:${d}%"></b></i>${d}%</div>`).join('')}</div></div></section>
    ${similar.length ? `<section class="sec"><h2>Similar ${esc(O.h1.toLowerCase())}</h2><div class="row">${similar.map(x => UPUI.card(x)).join('')}</div></section>` : ''}
  </div>
  <aside class="cp">
    <div class="cbox">
      <div class="pr">${pt.n}<span> ${pt.u}</span></div>
      ${seg ? `<div class="alt">${seg.options.map(p => `<button class="${per === p.v ? 'on' : ''}" data-per="${p.v}">${esc(p.l)}</button>`).join('')}</div>` : ''}
      <div class="sub">${esc(O.basis)} · Ref ${esc(l.ref)} · No UpNow fees</div>
      <hr>${UPUI.providerHead(l)}
      <div class="resp"><i></i>Usually replies within ${l.provider.reply} minutes</div>
      <div class="ctas" style="margin-top:14px"><button class="btn btn-g" data-req="${l.id}">${ico('cal')}${esc(O.action)}</button>
        <div class="two"><button class="btn btn-o" data-call="${l.id}">${ico('phone')}Call</button><button class="btn btn-wa" data-wa="${l.id}">${ico('wa')}WhatsApp</button></div></div>
    </div>
    <div class="safety"><b>${ico('shield')}Deal safely</b>Never pay a deposit before confirming details with the provider in person. UpNow will never ask you to pay through us.</div>
  </aside></div>`;
  document.getElementById('mbar').innerHTML = `<button class="btn btn-o" data-call="${l.id}">${ico('phone')}Call</button><button class="btn btn-wa" data-wa="${l.id}">${ico('wa')}WhatsApp</button>`;
  UPUI.updateHdrCounts();
}
document.addEventListener('click', e => {
  const p = e.target.closest('[data-per]'); if (p) { per = p.dataset.per; paint(); return; }
  const g = e.target.closest('[data-lb]'); if (g && l.img.length) openLb(+g.dataset.lb);
});
let lbI = 0; const lb = document.getElementById('lb');
function openLb(i) { lbI = i % l.img.length; lb.innerHTML = `<img src="${l.img[lbI]}"><button class="l" data-lbm="-1">${ico('chevL')}</button><button class="r" data-lbm="1">${ico('chevR')}</button><button class="c" data-lbc>${ico('x')}</button><div class="n">${lbI + 1} / ${l.img.length}</div>`; lb.classList.add('on'); }
lb.addEventListener('click', e => { const m = e.target.closest('[data-lbm]'); if (m) { openLb(lbI + +m.dataset.lbm + l.img.length); return; } if (e.target.closest('[data-lbc]') || e.target === lb) lb.classList.remove('on'); });
document.addEventListener('keydown', e => { if (!lb.classList.contains('on')) return; if (e.key === 'ArrowRight') openLb(lbI + 1); if (e.key === 'ArrowLeft') openLb(lbI - 1 + l.img.length); if (e.key === 'Escape') lb.classList.remove('on'); });
paint();
</script>
</body></html>
